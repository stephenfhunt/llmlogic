[package]
name = "datalog"
version = "0.1.0"
edition = "2024"
description = "A Datalog engine targeted at LLM/agent use, with convenient import of fact tables from external sources."
# Licensing deliberately deferred (all rights reserved by default); no repository
# URL until a remote exists. Set both before any publish.
readme = "README.md"
keywords = ["datalog", "logic", "reasoning", "llm", "agent"]
categories = ["database", "parsing"]

# The engine lives in the library so it stays reusable and testable; the binary
# is a thin CLI/REPL wrapper over it.
[lib]
name = "datalog"
path = "src/lib.rs"

[[bin]]
name = "datalog"
path = "src/main.rs"

# Dependencies are intentionally empty for the starter. Candidates (serde/serde_json
# for the agent API, csv/rusqlite/parquet for sources, a lexer/parser crate) get
# chosen as the spec matures — see spec.md §17 (decisions log).
[dependencies]

[dev-dependencies]
proptest = "1.11.0"
