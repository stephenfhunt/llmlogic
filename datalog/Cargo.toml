[package]
name = "datalog"
version = "0.1.0"
edition = "2024"
description = "A Datalog engine targeted at LLM/agent use, with convenient import of fact tables from external sources."
repository = "https://github.com/stephenfhunt/llmlogic"
# Licensing deliberately deferred (all rights reserved by default). Set `license`
# before any publish — crates.io rejects a package without one.
readme = "README.md"
keywords = ["datalog", "logic", "reasoning", "llm", "agent"]
categories = ["database", "parsing"]
# `cargo run` means the engine; the packaging bin is opt-in via its feature.
default-run = "datalog"

# The engine lives in the library so it stays reusable and testable; the binary
# is a thin CLI/REPL wrapper over it.
[lib]
name = "datalog"
path = "src/lib.rs"

[[bin]]
name = "datalog"
path = "src/main.rs"

# Build-tooling only: assembles the drop-in Claude Code skill bundle
# (`cargo package-skill`, aliased in `.cargo/config.toml`). Gated behind the
# `packaging` feature so it is excluded from normal `build`/`test`/`clippy
# --all-targets`; std-only, no dependencies.
[[bin]]
name = "package-skill"
path = "src/bin/package_skill.rs"
required-features = ["packaging"]

[features]
# Imports are on by default (§13, §17 2026-07-23): DuckDB is the single reader
# backend for CSV/JSONL/Parquet/URLs. `--no-default-features` is the escape
# hatch (fast lane, exotic targets); data imports then yield a structured error.
default = ["duckdb"]
duckdb = ["dep:duckdb"]
# Enables the `package-skill` build-tooling binary only.
packaging = []

# The core language engine stays zero-dependency (lexer/parser/lowering/eval);
# the §13 import layer is the deliberate exception (spec §17, 2026-07-23).
# Remaining candidates (serde/serde_json for the agent API) get chosen as the
# spec matures — see spec.md §17 (decisions log).
[dependencies]
# `json`/`parquet` compile those DuckDB extensions into the bundled build
# (read_json / read_parquet, §13 formats).
duckdb = { version = "1", features = ["bundled", "json", "parquet"], optional = true }

[dev-dependencies]
proptest = "1.11.0"

# A release build with line tables, for heaptrack/valgrind/perf stacks. Its own
# profile so it lands in `target/profiling/` and never replaces the
# `target/release/datalog` that `code-analysis`'s tests and bench run.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
