[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmlogic-experiments"
version = "0.1.0"
description = "Does an agent reason better with a logic engine? The harness that measures it."
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk",  # the subject: Claude Code as a library, so it has a filesystem and grep
    "anthropic",         # cost accounting and token counting
    "pyarrow",           # the `imports` fixture writes a real Parquet copy (decisions.md)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",  # domain fixtures are generated; the oracle is truth.py
    "ruff",
]

[project.scripts]
harness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scratch on the same filesystem as the engine binary, so `arms.build` can
# hardlink it (`arms._link_binary`). Under the default `/tmp` — a tmpfs here —
# the link falls back to a 51 MB copy per engine-arm workspace, and a few runs
# of the suite fill the device: every test then fails with `Disk quota
# exceeded`, which reads like anything but a temp directory being on the wrong
# mount.
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
